# Mounted over the nginx image's own /etc/nginx/conf.d/default.conf.
#
# The image (frontend/bnv-manager-v2 in myOmikron/code) only serves the SPA;
# in the stacks over there traefik routes /api to the webserver. This stack is
# a single nginx behind the host's reverse proxy, so the proxy pass lives here
# — everything below the /api location is that image's config, kept in sync
# with it.
server {
    listen 80;

    # Nothing gains from knowing which nginx this is; a version number is only
    # useful to someone matching it against a vulnerability list.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://webserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        add_header Cache-Control no-cache;
        client_max_body_size 50m;
    }

    # vite content-hashes everything under /assets/, so those may be cached
    # forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: unknown paths fall back to index.html — TanStack Router uses
    # browser history, so a deep link (e.g. an invite or credential-reset link)
    # must serve the app shell, not a 404. Revalidated on every request,
    # otherwise a stale index.html keeps referencing assets a new deploy has
    # replaced.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
